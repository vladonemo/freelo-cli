name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: 0

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Opens / updates a "Version Packages" PR. When that PR is merged
      # and there are no remaining changesets, publishes to npm via OIDC
      # (Trusted Publishers — see https://docs.npmjs.com/trusted-publishers).
      # The `id-token: write` permission above is what npm verifies against
      # the registered Trusted Publisher for `freelo-cli`. No NPM_TOKEN
      # secret is required.
      #
      # GITHUB_TOKEN must be a PAT (or GitHub App token), NOT the default
      # `secrets.GITHUB_TOKEN`. GitHub suppresses workflow runs from events
      # triggered by the default token, so the Version Packages PR opened
      # with it never fires `ci.yml` and stays blocked by branch protection.
      # `RELEASE_GITHUB_TOKEN` is a fine-grained PAT scoped to this repo
      # with Contents: read/write and Pull requests: read/write.
      #
      # We also disable `setupGitUser` and configure git ourselves below.
      # `changesets/action@v1` otherwise hard-codes the committer to
      # `github-actions[bot]`. PAT-authenticated `pull_request: opened`
      # events from a bot committer DO trigger workflows, but subsequent
      # `pull_request: synchronize` force-pushes do NOT — so the second
      # and later updates of the Version Packages PR would silently fail
      # to refresh CI and the PR would stay blocked by branch protection.
      - name: Configure git committer (non-bot, so synchronize fires CI)
        run: |
          git config --global user.name "Vladimir Nemergut"
          git config --global user.email "vlado.nemo@gmail.com"

      - name: changesets
        uses: changesets/action@v1
        with:
          setupGitUser: false
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
